<!doctype html>
<html lang="th">
<head>

    * { box-sizing:border-box; } body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; background:var(--background); color:var(--foreground); font-family:system-ui,sans-serif; }
    main { width:100%; max-width:420px; text-align:center; } img { width:80px; height:80px; } h1 { margin:20px 0 8px; font-size:28px; } h2 { font-size:20px; margin:0 0 16px; } p { color:var(--muted); line-height:1.8; } a { display:inline-block; margin-top:12px; padding:12px 24px; border-radius:8px; color:var(--action-text); background:var(--action); text-decoration:none; font-weight:600; }
  </style>
</head>
<body><main>
  <img src="/icon-192.png" alt="" width="80" height="80">
